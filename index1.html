<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>

        <!-- Tutto parte da un container! (metto un min height altrimenti non vedresti nulla dato che non c'è praticamente niente) -->
        <div class="container" style="min-height: 100vh;">
            <!-- Dopo metti una row, l'altezza varia in base al contenuto automaticamente! -->
             <div class="row">
                <!-- ora gestisci le colonne, massimo 12 (la somma per row deve essere sempre 12)-->
                 <div class="col-6">
                    <p>colonna sx</p>
                 </div>
                 <div class="col-6">
                    <p>colonna dx</p>
                 </div>
             </div>
        </div>

    </body>
</html>
